# Every push and pull request: all tests, the same ones run locally (npm test and cargo test), then the downloads.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The exact Rust version for every cargo command here (rust-toolchain.toml says "stable" for local builds).
env:
  RUSTUP_TOOLCHAIN: "1.99.0-x86_64-pc-windows-msvc"

jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token needn't stay where npm and cargo build scripts can read it.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The exact Rust version (RUSTUP_TOOLCHAIN above); the website builds its receipts as WebAssembly.
      - run: rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal --target wasm32-unknown-unknown
      # skia-bindings' build script downloads Skia's prebuilt libraries without checking them: fetch the
      # archive this build uses here, check it, and point the build at the checked copy. A new
      # skia-bindings version (or other features) needs a different archive: update the name and hash.
      - name: Fetch Skia's prebuilt libraries (checked)
        shell: pwsh
        run: |
          $name = "skia-binaries-b7f043e0b1e2a850e702-x86_64-pc-windows-msvc-d3d-ganesh-gl-jpegd-jpege-pdf.tar.gz"
          $dir = Join-Path $env:RUNNER_TEMP "skia"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = Join-Path $dir $name
          Invoke-WebRequest -Uri "https://github.com/rust-skia/skia-binaries/releases/download/0.153.3/$name" -OutFile $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "a19adbcb3c8e9d691ce4e9350fcc3e3ce066a0793263d5358185efbceae46f30") { throw "The Skia download doesn't match its known hash ($hash)" }
          "SKIA_BINARIES_URL=file://$($dir.Replace('\', '/'))/skia-binaries-{key}.tar.gz" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm ci
      - run: npm test
      # Every test program runs, so one run shows every failure.
      - run: cargo test --workspace --locked --no-fail-fast

      # The downloads, built as the release builds them (the installer script, the runtime DLLs and the
      # start checks), so a packaging problem shows on a push, not first on a release tag.
      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732") { throw "The Inno Setup download doesn't match its known hash ($hash)" }
          $dir = Join-Path $env:RUNNER_TEMP "inno"
          Start-Process -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir" -Wait
          "ISCC=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm run package:windows
