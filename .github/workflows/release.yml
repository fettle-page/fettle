# A version tag (v1.0.0) builds the downloads here, in the open, from that tag's source:
# the installer, the portable zip and SHA256SUMS.txt, with a build attestation for each download.
# It makes a draft release; a maintainer reads it and publishes it, together with the website
# (the site's /app/latest.json tells the app which version is newest).
#
# Two jobs: "build" runs every install and build script (npm, cargo, Inno Setup) and can only read
# the repository; "publish" holds the write rights and runs none of them. It only checks the files
# against SHA256SUMS.txt, attests them and drafts the release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

# The exact Rust version for every cargo command here (rust-toolchain.toml says "stable" for local builds).
env:
  RUSTUP_TOOLCHAIN: "1.99.0-x86_64-pc-windows-msvc"

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token needn't stay where npm and cargo build scripts can read it.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run release:check
      - run: rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal --target wasm32-unknown-unknown
      # skia-bindings' build script downloads Skia's prebuilt libraries without checking them: fetch the
      # archive this build uses here, check it, and point the build at the checked copy. A new
      # skia-bindings version (or other features) needs a different archive: update the name and hash.
      - name: Fetch Skia's prebuilt libraries (checked)
        shell: pwsh
        run: |
          $name = "skia-binaries-b7f043e0b1e2a850e702-x86_64-pc-windows-msvc-d3d-ganesh-gl-jpegd-jpege-pdf.tar.gz"
          $dir = Join-Path $env:RUNNER_TEMP "skia"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = Join-Path $dir $name
          Invoke-WebRequest -Uri "https://github.com/rust-skia/skia-binaries/releases/download/0.153.3/$name" -OutFile $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "a19adbcb3c8e9d691ce4e9350fcc3e3ce066a0793263d5358185efbceae46f30") { throw "The Skia download doesn't match its known hash ($hash)" }
          "SKIA_BINARIES_URL=file://$($dir.Replace('\', '/'))/skia-binaries-{key}.tar.gz" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm ci
      - run: npm test
      # Every test program runs, so one run shows every failure.
      - run: cargo test --workspace --locked --no-fail-fast

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732") { throw "The Inno Setup download doesn't match its known hash ($hash)" }
          $dir = Join-Path $env:RUNNER_TEMP "inno"
          Start-Process -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$dir" -Wait
          "ISCC=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: npm run package:windows

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downloads
          path: |
            target/package/Fettle-Setup-*.exe
            target/package/Fettle-*-portable.zip
            target/package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downloads
          path: downloads

      # The files must be exactly what the build made.
      - working-directory: downloads
        run: sha256sum -c SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            downloads/Fettle-Setup-*.exe
            downloads/Fettle-*-portable.zip

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --draft --title "Fettle $version" --notes "What's new: https://fettle.page/changelog" \
            "downloads/Fettle-Setup-$version.exe" "downloads/Fettle-$version-portable.zip" downloads/SHA256SUMS.txt
