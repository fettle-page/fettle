[workspace]
resolver = "3"
members = ["crates/fettle-facts", "crates/fettle-collect", "crates/fettle-verdicts", "crates/fettle-receipt", "crates/fettle-wasm", "apps/windows"]

# The receipt as WebAssembly for the website and share Worker (crates/fettle-wasm): small over fast.
# Its own profile, so the Windows app's release build is untouched.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
