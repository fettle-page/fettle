<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
  /* No report data in this image: it's the same card for every shared receipt. */
  h1 { top: 170px; }
  .sub { position: absolute; left: 74px; top: 390px; width: 560px; font: 500 30px/1.35 "Bricolage"; color: rgb(243 241 234 / 0.82); }
</style>
</head>
<body>
<div class="ruler"></div>
<img class="wordmark" src="../../../../assets/brand/fettle-wordmark-light.svg" alt="">
<h1>A Fettle <em>receipt.</em></h1>
<p class="sub">A PC check-up in plain words. Open the link to read it.</p>
<p class="fine">Free · open source · no tracking</p>
<div class="slip">
  <div class="head"><img src="../../../../assets/brand/fettle-wordmark.svg" alt=""><span>RECEIPT</span></div>
  <hr>
  <div class="row"><span>STORAGE</span><span class="bar"></span></div>
  <div class="row"><span>BATTERY</span><span class="bar"></span></div>
  <div class="row"><span>MEMORY</span><span class="bar"></span></div>
  <div class="row"><span>WINDOWS</span><span class="bar"></span></div>
  <div class="row"><span>STARTUP</span><span class="bar"></span></div>
  <div class="row"><span>GRAPHICS</span><span class="bar"></span></div>
  <div class="barcode"></div>
</div>
<div class="stamp">Checked</div>
</body>
</html>
