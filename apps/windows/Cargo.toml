[package]
name = "fettle-windows"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "fettle_windows"
path = "src/lib.rs"

[[bin]]
name = "fettle"
path = "src/main.rs"

[dependencies]
fettle-facts = { path = "../../crates/fettle-facts" }
fettle-collect = { path = "../../crates/fettle-collect" }
fettle-verdicts = { path = "../../crates/fettle-verdicts" }
fettle-receipt = { path = "../../crates/fettle-receipt" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "renderer-software", "accessibility", "compat-1-2", "raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
krilla = "0.8.2"
ttf-parser = "0.25"
rfd = "0.17.2"
arboard = "3"
ureq = { version = "3", default-features = false, features = ["native-tls", "platform-verifier", "win-system-proxy"] }
qrcodegen = "1.8.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_Storage_Xps_Printing", "Win32_Globalization", "Win32_System_Time", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Services", "Win32_Graphics_Printing"] }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
rqrr = "0.11.0"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.31"
