[package]
name = "fettle-collect"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
fettle-facts = { path = "../fettle-facts" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemInformation", "Win32_System_Threading"] }
wmi = "0.18.4"
