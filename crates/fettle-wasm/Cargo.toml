[package]
name = "fettle-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The receipt behind a JSON-in, JSON-out interface for wasm32, used by the website and share Worker."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fettle-facts = { path = "../fettle-facts" }
fettle-verdicts = { path = "../fettle-verdicts" }
fettle-receipt = { path = "../fettle-receipt" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
