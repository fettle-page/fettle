[package]
name = "fettle-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nvml-wrapper = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading"] }
winreg = "0.56.0"
wmi = "0.18.4"

[dev-dependencies]
tempfile = "3.27.0"
